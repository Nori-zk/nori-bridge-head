[package]
version = "0.1.0"
name = "nori-sp1-helios-primitives"
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = ["helios"]
helios = ["dep:helios-consensus-core"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
helios-consensus-core = { workspace = true, optional = true }
alloy-primitives = { workspace = true, features = ["sha3-keccak", "serde"] }
alloy-trie = { workspace = true, features = ["ethereum", "serde"] }
anyhow = { workspace = true }

# Example-only; kept out of [dependencies] so the guest build does not pull it in.
[dev-dependencies]
serde_json = { workspace = true }
alloy = { workspace = true }