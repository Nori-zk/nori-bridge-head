[workspace]
members = ["nori", "nori-hash", "nori-program", "nori-build-zk", "nori-test-fixtures", "nori-elf"]
resolver = "2"

[workspace.package]
license = "MIT"
edition = "2021"
authors = ["xavierdmello", "ratankaliani"]
homepage = "https://github.com/Nori-zk/nori-bridge-head"
repository = "https://github.com/Nori-zk/nori-bridge-head"

[workspace.dependencies]

# nori
nori = { path = "nori" }
nori-hash = { path = "nori-hash" }
nori-sp1-helios-primitives = { path = "nori-primitives" }
nori-sp1-helios-program = { path = "nori-program" }

# helios
helios-consensus-core = { git = "https://github.com/a16z/helios", tag = "0.12.0" }
helios-ethereum = { git = "https://github.com/a16z/helios", tag = "0.12.0" }

# general
dotenv = "0.15.0"
sp1-sdk = { version = "6.8.1", features = ["network", "cuda"] }
sp1-build = "6.8.1"
sp1-cuda = "6.8.1"
tokio = { version = "1.38.0", features = ["signal", "rt-multi-thread", "macros"] }
serde = "1.0.203"
serde_cbor = "0.11.2"
serde_json = "1.0.125"
alloy-sol-types = "1.3.0"
alloy-trie = "0.9.1"
alloy-consensus = { version = "2.5.0", default-features = false }
alloy-rlp ={ version = "0.3.9", default-features = false, features = [
    "derive",
    "arrayvec",
] }
clap = "4.5.9"
log = "0.4.22"
env_logger = "0.11.3"
alloy-primitives = "1.3.0"
alloy = { version = "1.0.37", features = ["full", "signer-ledger"] }
anyhow = "1.0.86"
reqwest = { version = "0.12.5", features = ["blocking"] }
tree_hash = "0.10.0"
cargo_metadata = "0.18"
sha2-v0-10-8 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", package = "sha2", tag = "patch-sha2-0.10.8-sp1-6.2.0" }

[patch.crates-io]
tiny-keccak = { git = "https://github.com/sp1-patches/tiny-keccak", tag = "patch-2.0.2-sp1-6.2.0" }
bls12_381 = { git = "https://github.com/sp1-patches/bls12_381", tag = "patch-0.8.0-sp1-6.0.0-v2" }
# From upstream: https://github.com/a16z/helios/blob/0.12.0/Cargo.toml#L134
ethereum_hashing = { git = "https://github.com/ncitron/ethereum_hashing", rev = "7ee70944ed4fabe301551da8c447e4f4ae5e6c35" }