[package]
version = "0.1.0"
name = "nori-hash"
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
alloy-primitives = { workspace = true, features = ["sha3-keccak"] }
anyhow = { workspace = true }
sha2-v0-10-8 = { workspace = true }

# The Helios store modules need these; merkle_sha256_fixed does not, so a
# wasm32 build (the TS SDK's request leaf and Merkle hashing) drops them.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
helios-consensus-core = { workspace = true }
serde_cbor = { workspace = true }
alloy-sol-types = { workspace = true }
tree_hash = { workspace = true }
serde_json = { workspace = true }
rmp-serde = "1.2.0"
